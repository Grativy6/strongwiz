name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock.txt
          python -m pip install -e ".[calibration]"
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src/strongwiz
      - name: Tests
        run: python -m pytest --cov=strongwiz --cov-report=term-missing
      - name: Source identity registry
        run: python -m strongwiz verify-sources docs/source-identities.json
      - name: Shadow-route example
        run: python examples/shadow_route.py
      - name: Sealed non-ARC reference lab
        run: >-
          python examples/reference_counter_lab.py
          --authorize-local-demo
          --lab-root playground/ci-reference-lab
          --capsule-root playground/ci-reference-capsule
      - name: Local two-build artifact identity
        if: runner.os == 'Linux'
        run: >-
          python scripts/verify_reproducible_build.py
          --run-id ci
          --receipt artifacts/local/ci-v0.2.0-build.json
